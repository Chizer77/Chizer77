<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乌鸦</title>
<style>* { box-sizing: border-box; }
body { margin: 0; padding: 40px 20px; background: #0d1117; color: #c9d1d9; font: 14px/1.7 "Microsoft YaHei", sans-serif; }
main { max-width: 846.4px; margin: auto; }
.eyebrow { margin-bottom: 12px; color: #8bc9a1; font: 11px Consolas, monospace; letter-spacing: 2px; }
.strip { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.companion { height: 128px; display: flex; align-items: end; justify-content: center; }
.companion img { width: 48px; height: 80px; image-rendering: pixelated; }
@media (max-width: 500px) { body { padding: 26px 14px; } }
</style>
</head>
<body class="crow">
<main>
<div class="eyebrow">CROW</div>
<img class="strip" src="../../../../assets/crow/crow.svg" alt="雨城石墙上的乌鸦巡游">
</main>
</body>
</html>
