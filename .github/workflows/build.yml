name: Retro README build

on:
  push:
    branches: [retro]
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-build-retro
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/retro' && github.event.repository.default_branch == 'retro'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SPONSORKIT_AFDIAN_TOKEN: ${{ secrets.SPONSORKIT_AFDIAN_TOKEN }}
      SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: retro
      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-snake-dark.svg?palette=github-dark
      - name: Update GitHub data and terminal SVG
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          pnpm profile:refresh
      - name: Build README
        run: pnpm build
      - name: Update sponsors
        if: env.SPONSORKIT_GITHUB_TOKEN != '' || env.SPONSORKIT_AFDIAN_TOKEN != ''
        run: pnpm exec sponsorkit
        env:
          SPONSORKIT_AFDIAN_USER_ID: f6bca0fc272711f0aace52540025c377
          SPONSORKIT_GITHUB_LOGIN: Chizer77
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html assets/profile/profile.svg scripts/profile/github.json
          git add github-snake-dark.svg
          git add sponsorkit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update README and profile assets"
          git push origin HEAD:refs/heads/retro
